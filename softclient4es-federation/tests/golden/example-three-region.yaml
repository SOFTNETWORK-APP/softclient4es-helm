    app.kubernetes.io/part-of: softclient4es
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: softclient4es-federation
      app.kubernetes.io/instance: fed
      app.kubernetes.io/component: sidecar
      softclient4es.app/sidecar: us-east-1
  template:
    metadata:
      labels:
        helm.sh/chart: softclient4es-federation-0.3.5
        app.kubernetes.io/name: softclient4es-federation
        app.kubernetes.io/instance: fed
        app.kubernetes.io/component: sidecar
        softclient4es.app/sidecar: us-east-1
        app.kubernetes.io/version: "0.2.5"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: softclient4es
    spec:
      serviceAccountName: fed-softclient4es-federation
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sidecar
          image: "docker.io/softnetwork/softclient4es8-arrow-flight-sql:0.2.5"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
          ports:
            - name: flight-sql
              containerPort: 32010
              protocol: TCP
          env:
            # ── Arrow Flight SQL server (arrow.flight.*) ──
            - name: ARROW_HOST
              value: "0.0.0.0"
            - name: ARROW_PORT
              value: "32010"
            - name: ARROW_BATCH_SIZE
              value: "1000"
            - name: ARROW_QUERY_TIMEOUT_SECONDS
              value: "120"
            - name: ARROW_JOIN_MAX_MEMORY
              value: "256m"
            - name: ARROW_JOIN_UPGRADE_URL
              value: "https://portal.softclient4es.com/pricing"
            # ── Elasticsearch connection (elastic.credentials.* — VERIFIED, NOT a single URL) ──
            - name: ELASTIC_SCHEME
              value: "https"
            - name: ELASTIC_HOST
              value: "es-us-east-1.example.com"
            - name: ELASTIC_PORT
              value: "9200"
            - name: ELASTIC_AUTH_METHOD
              valueFrom:
                secretKeyRef:
                  name: sc4es-es-us-east-1
                  key: es-auth-method
                  optional: true
            - name: ELASTIC_CREDENTIALS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sc4es-es-us-east-1
                  key: es-username
                  optional: true
            - name: ELASTIC_CREDENTIALS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sc4es-es-us-east-1
                  key: es-password
                  optional: true
            - name: ELASTIC_CREDENTIALS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sc4es-es-us-east-1
                  key: es-api-key
                  optional: true
            - name: ELASTIC_CREDENTIALS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sc4es-es-us-east-1
                  key: es-bearer-token
                  optional: true
            # ── Sidecar SERVER-SIDE auth (incoming) — single source of truth with the
            #    federation's outgoing servers.<name>.credentials (rendered in the ConfigMap) ──
            - name: ARROW_AUTH_METHOD
              value: "bearer"
            - name: ARROW_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sc4es-arrow-us-east-1
                  key: arrow-username
                  optional: true
            - name: ARROW_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sc4es-arrow-us-east-1
                  key: arrow-password
                  optional: true
            - name: ARROW_AUTH_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sc4es-arrow-us-east-1
                  key: arrow-bearer-token
                  optional: true
            - name: ARROW_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sc4es-arrow-us-east-1
                  key: arrow-api-key
                  optional: true
            # ── Telemetry opt-out (shared with federation) ──
            # VERIFIED: SOFTCLIENT4ES_TELEMETRY_ENABLED is honored by the sidecar too — the env
            # override lives in elasticsql licensing reference.conf:30 (softclient4es.telemetry.enabled),
            # read by TelemetryConfig.load, on which the arrow sidecar depends transitively. NOTE it is
            # NOT in arrowServerSettings.dockerEnvVars (build.sbt:243-255 bakes only ELASTIC_*/ARROW_*),
            # so the chart MUST set it explicitly here for the opt-out to reach the sidecar.
            - name: SOFTCLIENT4ES_TELEMETRY_ENABLED
              value: "true"
            - name: SOFTCLIENT4ES_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: sc4es-pro-license
                  key: license-key
                  optional: true
            - name: SOFTCLIENT4ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sc4es-pro-license
                  key: api-key
                  optional: true
          # TCP probes — the sidecar has NO gRPC health service (VERIFIED); a raw TCP
          # connect to ARROW_PORT proves the Flight SQL server is listening.
          livenessProbe:
            tcpSocket:
              port: flight-sql
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: flight-sql
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 1536Mi
            requests:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        # Writable /tmp: the sidecar runs the same-cluster JOIN engine on DuckDB
        # (DuckDBJoinExecutor via LocalJoinHandler — VERIFIED), whose org.duckdb JDBC
        # driver extracts its native libduckdb_java to java.io.tmpdir on first JOIN.
        # readOnlyRootFilesystem=true without this would crash the first JOIN query.
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
