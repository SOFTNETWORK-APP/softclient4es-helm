# tests/values/secret-auth.yaml — 1 sidecar, Secret-backed ES + sidecar bearer auth.
# License-free (1 sidecar, Community maxClusters=1 — FACT D), so CI runs it unconditionally.
# Exercises: ES creds via secretKeyRef, sidecar ARROW_AUTH_* via secretKeyRef, and the
# federation CONFIG_FORCE_* override path (override_with_env_vars) end-to-end.
sidecars:
  - name: prod-us
    elasticsearchVersion: 8
    elasticsearch:
      url: "https://es-us.example.com:9200"
      credentialsSecretName: es-prod-us
    auth:
      method: bearer
      credentialsSecretName: prod-us-arrow-auth   # feeds sidecar ARROW_AUTH_* + federation CONFIG_FORCE_*
    default: true
