{{- if gt (len .Values.sidecars) 0 }}
{{- /* Validate at most one default sidecar (matches FederationConfig fail-fast). */ -}}
{{- $defaults := list -}}
{{- range $s := .Values.sidecars }}{{- if $s.default }}{{- $defaults = append $defaults $s.name }}{{- end }}{{- end -}}
{{- if gt (len $defaults) 1 }}{{- fail (printf "At most one sidecar may be default=true; got: %v" $defaults) }}{{- end -}}
{{- /* Validate sidecar names are unique (each is a k8s resource suffix AND a servers.<name> HOCON key). */ -}}
{{- $names := list -}}
{{- range $s := .Values.sidecars }}{{- $names = append $names (required "every sidecar requires a name" $s.name) }}{{- end -}}
{{- if ne (len $names) (len (uniq $names)) }}{{- fail (printf "sidecar names must be unique; got: %v" $names) }}{{- end -}}
{{- /* STRICT RFC1123-LABEL gate (Story 16.3): a sidecar name is BOTH a k8s resource suffix
       AND the servers.<name> HOCON key AND the source for the CONFIG_FORCE_* env-var path
       (override_with_env_vars). The mangling `-`->`__` is injective ONLY for lowercase
       alphanumeric + '-' names; a name with '_'/'.'/uppercase would mangle to a WRONG
       CONFIG_FORCE_* path that silently fails to override -> federation validate() CrashLoop.
       Fail at TEMPLATE time so the bug never reaches a cluster. */ -}}
{{- range $s := .Values.sidecars }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $s.name) }}{{- fail (printf "sidecar %q: name must be a strict RFC1123 label (lowercase alphanumeric + '-', no leading/trailing '-'); it is used as a k8s resource suffix, a HOCON servers.<name> key, and the CONFIG_FORCE_* override path (an '_'/'.'/uppercase would silently mis-target the federation credential override)" $s.name) }}{{- end }}
{{- end -}}
{{- /* FAIL-FAST on federation-outgoing credentials that cannot be delivered.
       FlightCredentials.validate() (VERIFIED, FlightCredentials.scala:145-178) REJECTS a
       credentials{} block whose method is basic/apikey/bearer but whose required fields are
       empty -> FederationConfig.fromConfig throws -> federation sys.exit(1) (CrashLoop).
       Story 16.3 (FACT A): a `credentialsSecretName` is now a VALID source — the value arrives
       via CONFIG_FORCE_* (override_with_env_vars) on the federation Deployment, so the ConfigMap
       renders method-only. We therefore fail ONLY when method != none AND there is NEITHER an
       inline value NOR a Secret source; and additionally when a Secret IS set but
       federation.credentialsFromEnv=false (the federation then literally cannot read it). */ -}}
{{- range $s := .Values.sidecars }}
{{- with $s.auth }}
{{- $m := lower (default "none" .method) }}
{{- if ne $m "none" }}
{{- $hasSecret := .credentialsSecretName }}
{{- if eq $m "basic" }}{{- if and (not $hasSecret) (or (not .username) (not .password)) }}{{- fail (printf "sidecar %q: auth.method=basic needs auth.credentialsSecretName (recommended) OR inline auth.username+auth.password" $s.name) }}{{- end }}{{- end }}
{{- if or (eq $m "apikey") (eq $m "api") }}{{- if and (not $hasSecret) (not .apiKey) }}{{- fail (printf "sidecar %q: auth.method=apikey needs auth.credentialsSecretName OR inline auth.apiKey" $s.name) }}{{- end }}{{- end }}
{{- if eq $m "bearer" }}{{- if and (not $hasSecret) (not .bearerToken) }}{{- fail (printf "sidecar %q: auth.method=bearer needs auth.credentialsSecretName OR inline auth.bearerToken" $s.name) }}{{- end }}{{- end }}
{{- if and $hasSecret (not $.Values.federation.credentialsFromEnv) }}{{- fail (printf "sidecar %q: auth.credentialsSecretName is set but federation.credentialsFromEnv=false — the federation cannot read the Secret; set federation.credentialsFromEnv=true (CONFIG_FORCE_* injection) or supply inline creds" $s.name) }}{{- end }}
{{- /* The federation's CONFIG_FORCE_* path is ALWAYS per-key (secretKeyRef.key = the semantic
       key e.g. arrow-bearer-token). auth.useEnvFrom shapes the SIDECAR's Secret with env-var-NAME
       keys (ARROW_AUTH_*), which the federation cannot read for its per-key override -> the
       CONFIG_FORCE_* env would resolve empty -> federation CrashLoop. Reject the incompatible
       combo at template time (fail-fast over a silent boot failure). */ -}}
{{- if and $hasSecret .useEnvFrom $.Values.federation.credentialsFromEnv }}{{- fail (printf "sidecar %q: auth.useEnvFrom=true is incompatible with a Secret-backed federation->sidecar credential — the federation reads the Secret per-key (e.g. key %q) but useEnvFrom requires the Secret's keys to be env-var NAMES (ARROW_AUTH_*). Use per-key mode (auth.useEnvFrom=false) for a Secret-backed non-none auth method, OR supply the federation cred inline" $s.name (include "softclient4es-federation.arrowSecretKey" (dict "auth" . "field" "bearerToken"))) }}{{- end }}
{{- end }}
{{- end }}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "softclient4es-federation.fullname" . }}-config
  labels:
    {{- include "softclient4es-federation.labels" . | nindent 4 }}
data:
  application.conf: |
    # GENERATED by the softclient4es-federation Helm chart — do not edit in-cluster.
    # Populates arrow.flight.federation.servers from values.yaml `sidecars[]`.
    # The scalar FEDERATION_* settings are still supplied via env vars on the
    # Deployment; this file ONLY carries the `servers` map (which has no env override).
    arrow.flight.federation {
      servers {
        {{- range $s := .Values.sidecars }}
        {{ $s.name }} {
          host = "{{ include "softclient4es-federation.sidecarFullname" (dict "ctx" $ "sidecar" $s) }}.{{ $.Release.Namespace }}.svc.cluster.local"
          port = 32010
          {{- if $s.alias }}
          alias = "{{ $s.alias }}"
          {{- end }}
          {{- if $s.default }}
          default = true
          {{- end }}
          {{- with $s.auth }}
          {{- if and .method (ne (lower .method) "none") }}
          # Federation OUTGOING auth to this sidecar — single source of truth with the
          # sidecar's ARROW_AUTH_* env. For a Secret-backed credential (credentialsSecretName)
          # the VALUE is absent here and arrives via CONFIG_FORCE_* (override_with_env_vars) on
          # the federation Deployment (Story 16.3, FACT A) — this block then renders method-only,
          # and the override forces the value before FederationConfig.validate() runs. Inline
          # values (dev/test) are rendered when present.
          credentials {
            method = "{{ lower .method }}"
            {{- if .username }}
            username = "{{ .username }}"
            {{- end }}
            {{- if .password }}
            password = "{{ .password }}"
            {{- end }}
            {{- if .bearerToken }}
            bearer-token = "{{ .bearerToken }}"
            {{- end }}
            {{- if .apiKey }}
            api-key = "{{ .apiKey }}"
            {{- end }}
          }
          {{- end }}
          {{- end }}
          {{- if $s.tls }}
          tls = true
          {{- end }}
        }
        {{- end }}
      }
    }
{{- end }}
