{{- if gt (len .Values.sidecars) 0 }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "softclient4es-federation.fullname" . }}-test-catalogs
  labels:
    {{- include "softclient4es-federation.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: show-catalogs
      # Default: a public python image; CI + air-gapped clusters MUST pin `test.image`
      # to a PRE-BAKED image with adbc_driver_flightsql installed (no runtime pip).
      image: {{ .Values.test.image | default "python:3.12-slim" | quote }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          # If the image is NOT pre-baked, install ADBC at runtime (needs PyPI reachability).
          # PyArrow is REQUIRED: the ADBC DBAPI layer materialises adbc_get_objects()
          # results through pyarrow (read_all()), so without it GetCatalogs raises
          # "This API requires PyArrow to be installed".
          python -c "import adbc_driver_flightsql, pyarrow" 2>/dev/null || \
            pip install --quiet adbc_driver_flightsql=={{ .Values.test.adbcVersion | default "1.6.0" }} \
                                adbc_driver_manager=={{ .Values.test.adbcVersion | default "1.6.0" }} \
                                pyarrow{{ with .Values.test.pyarrowVersion }}=={{ . }}{{ end }}
          python - <<'PY'
          import sys, time
          import adbc_driver_flightsql.dbapi as dbapi
          host = "{{ include "softclient4es-federation.fullname" . }}"
          uri  = f"grpc://{host}:{{ .Values.service.port }}"
          expected = {{ len .Values.sidecars }}
          # The federation only reports its catalogs once it has DISCOVERED every downstream
          # (gRPC readiness is all-or-nothing). Retry the connect + GetCatalogs for up to ~60s.
          deadline = time.time() + 60
          last_err = None
          while time.time() < deadline:
              try:
                  conn = dbapi.connect(uri)
                  # GetCatalogs: one catalog_name row per registered sidecar alias (VERIFIED
                  # FederationFlightProducer.getStreamCatalogs — needs NO default downstream).
                  cats = [c["catalog_name"]
                          for c in conn.adbc_get_objects(depth="catalogs").read_all().to_pylist()]
                  cats = [c for c in cats if c]   # drop empty/system catalog if present
                  conn.close()
                  if len(cats) == expected:
                      print(f"OK: {len(cats)} catalogs: {cats}")
                      sys.exit(0)
                  last_err = f"expected {expected} catalogs, got {len(cats)}: {cats}"
              except Exception as e:   # connect refused while federation still NotReady
                  last_err = f"connect/get_objects error: {e}"
              time.sleep(3)
          print(f"FAIL: {last_err}", file=sys.stderr)
          sys.exit(1)
          PY
{{- end }}
