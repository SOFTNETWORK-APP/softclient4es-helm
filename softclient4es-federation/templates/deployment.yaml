{{- /* Story 16.3: does ANY sidecar use a Secret-backed (non-none) auth method? If so the
       federation must (a) set -Dconfig.override_with_env_vars=true and (b) inject the
       CONFIG_FORCE_* credential env from the SAME Secret the sidecar reads. */ -}}
{{- $secretAuth := false }}
{{- range $s := .Values.sidecars }}{{- if and $s.auth (ne (lower (default "none" $s.auth.method)) "none") $s.auth.credentialsSecretName }}{{- $secretAuth = true }}{{- end }}{{- end }}
{{- /* appVersion 0.3.0: the licence trust root is now embedded in the image and
       SOFTCLIENT4ES_LICENSE_PUBLIC_KEY is no longer consulted. This value used to decide
       HOW a licence was verified, so quietly dropping it would leave an operator believing
       an offline key is still in force. Fail the render instead, so it surfaces at
       `helm upgrade` rather than as a CrashLoopBackOff. Nothing fires at the "" default,
       so every committed golden stays byte-stable. */ -}}
{{- if .Values.license.publicKeySecretName }}
{{- fail "license.publicKeySecretName is no longer supported: as of appVersion 0.3.0 the licence trust root is embedded in the image, and SOFTCLIENT4ES_LICENSE_PUBLIC_KEY is ignored. Remove license.publicKeySecretName (and license.publicKeyKey). A licence issued by the SoftClient4ES licence server verifies with no extra configuration." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "softclient4es-federation.fullname" . }}
  labels:
    {{- include "softclient4es-federation.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "softclient4es-federation.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "softclient4es-federation.labels" . | nindent 8 }}
      {{- if gt (len .Values.sidecars) 0 }}
      annotations:
        # Roll the federation Pod whenever the rendered servers ConfigMap changes
        # (add/remove/edit a sidecar) so `helm upgrade` actually takes effect.
        checksum/config: {{ include (print $.Template.BasePath "/federation-configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "softclient4es-federation.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: federation
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: flight-sql
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.federation.health.port }}
              protocol: TCP
          env:
            - name: FEDERATION_HOST
              value: "0.0.0.0"
            - name: FEDERATION_PORT
              value: {{ .Values.service.port | quote }}
            - name: FEDERATION_MAX_MEMORY
              value: {{ .Values.federation.maxMemory | quote }}
            - name: FEDERATION_QUERY_TIMEOUT
              value: {{ .Values.federation.queryTimeoutSeconds | quote }}
            - name: FEDERATION_HEALTH_PORT
              value: {{ .Values.federation.health.port | quote }}
            - name: FEDERATION_HEALTH_PROBE_TIMEOUT
              value: {{ .Values.federation.health.probeTimeoutSeconds | quote }}
            - name: FEDERATION_DUCKDB_PATH
              value: {{ .Values.federation.duckdb.path | quote }}
            - name: FEDERATION_UPGRADE_URL
              value: {{ .Values.federation.upgradeUrl | quote }}
            - name: SOFTCLIENT4ES_TELEMETRY_ENABLED
              value: {{ .Values.telemetry.enabled | quote }}
            {{- if .Values.license.secretName }}
            - name: SOFTCLIENT4ES_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.license.secretName }}
                  key: {{ .Values.license.licenseKeyKey | default "license-key" }}
                  optional: true
            - name: SOFTCLIENT4ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.license.secretName }}
                  key: {{ .Values.license.apiKeyKey | default "api-key" }}
                  optional: true
            {{- end }}
            {{- if gt (len .Values.sidecars) 0 }}
            # Point Typesafe Config at the mounted ConfigMap so ConfigFactory.load()
            # picks up the `servers` map (which has NO env override). The native-packager
            # bash launcher reads $JAVA_OPTS at runtime (VERIFIED) and prepends it to the
            # JVM args; reference.conf still loads, so the FEDERATION_* env defaults stay.
            # Story 16.3: when any sidecar uses Secret-backed auth, also enable
            # override_with_env_vars so the CONFIG_FORCE_* env below force the credential
            # leaf onto the loaded config BEFORE FederationConfig.validate() runs.
            - name: JAVA_OPTS
              value: "-Dconfig.file=/opt/docker/conf/application.conf{{ if and $secretAuth .Values.federation.credentialsFromEnv }} -Dconfig.override_with_env_vars=true{{ end }}"
            {{- end }}
            {{- /* Federation OUTGOING credential leaves the Secret as CONFIG_FORCE_* env (Story
                   16.3, FACT A). ONE Secret feeds BOTH the sidecar (ARROW_AUTH_*) and the
                   federation here. The KEY/path is mangled (RFC1123-gated in the configmap);
                   the VALUE is a literal env string (no HOCON re-parse — special chars safe). */}}
            {{- if .Values.federation.credentialsFromEnv }}
            {{- range $s := .Values.sidecars }}
            {{- with $s.auth }}
            {{- if and (ne (lower (default "none" .method)) "none") .credentialsSecretName }}
            {{- $m := lower .method }}
            {{- if eq $m "basic" }}
            - name: {{ include "softclient4es-federation.configForceEnvName" (dict "name" $s.name "key" "username") }}
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecretName }}
                  key: {{ include "softclient4es-federation.arrowSecretKey" (dict "auth" . "field" "username") }}
                  optional: true
            - name: {{ include "softclient4es-federation.configForceEnvName" (dict "name" $s.name "key" "password") }}
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecretName }}
                  key: {{ include "softclient4es-federation.arrowSecretKey" (dict "auth" . "field" "password") }}
                  optional: true
            {{- else if eq $m "bearer" }}
            - name: {{ include "softclient4es-federation.configForceEnvName" (dict "name" $s.name "key" "bearer-token") }}
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecretName }}
                  key: {{ include "softclient4es-federation.arrowSecretKey" (dict "auth" . "field" "bearerToken") }}
                  optional: true
            {{- else if or (eq $m "apikey") (eq $m "api") }}
            - name: {{ include "softclient4es-federation.configForceEnvName" (dict "name" $s.name "key" "api-key") }}
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecretName }}
                  key: {{ include "softclient4es-federation.arrowSecretKey" (dict "auth" . "field" "apiKey") }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
          # --- Probes (FACT A / A1): TCP-socket only for the skeleton. ---
          # The federation health endpoint is gRPC grpc.health.v1.Health and returns
          # NOT_SERVING while servers={} (HealthService.scala:105-111), so a gRPC Check
          # probe would fail. A TCP probe proves the process is listening, which is the
          # correct liveness/readiness signal for a no-downstream skeleton. Story 16.2
          # switches readiness to a gRPC probe once sidecars exist.
          livenessProbe:
            tcpSocket:
              port: health
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.federation.health.probeTimeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # Readiness flips to a native gRPC probe once sidecars make the SERVING
          # aggregate meaningful (Story 16.2). ⚠️ ALL-OR-NOTHING: any one unreachable
          # downstream → NotReady → ALL queries fail (fail-closed). Set
          # federation.probes.useGrpc=false to keep TCP readiness (partial availability;
          # required on K8s < 1.27 — native gRPC probes are GA only from 1.27).
          {{- if and (gt (len .Values.sidecars) 0) .Values.federation.probes.useGrpc }}
          readinessProbe:
            grpc:
              port: {{ .Values.federation.health.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: flight-sql
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.federation.health.probeTimeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            {{- if gt (len .Values.sidecars) 0 }}
            - name: federation-config
              mountPath: /opt/docker/conf
              readOnly: true
            {{- end }}
      volumes:
        # readOnlyRootFilesystem=true requires a writable scratch dir: the org.duckdb
        # JDBC driver extracts its native libduckdb_java library to java.io.tmpdir (/tmp)
        # on every boot (PersistentDuckDB is instantiated unconditionally — even with
        # path=":memory:"), and the federation stages CTAS / INSERT-with-JOIN Parquet
        # under java.io.tmpdir (FederationConfig.scala:266-267 → /tmp/softclient4es/scratch).
        # A file DuckDB path (federation.duckdb.path != ":memory:") would also live here.
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.scratch.sizeLimit }}
        {{- if gt (len .Values.sidecars) 0 }}
        - name: federation-config
          configMap:
            name: {{ include "softclient4es-federation.fullname" . }}-config
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
