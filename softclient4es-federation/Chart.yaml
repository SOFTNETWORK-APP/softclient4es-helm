apiVersion: v2
name: softclient4es-federation
description: >-
  SoftClient4ES multi-cluster federation — an Arrow Flight SQL server that
  federates SQL queries (incl. cross-cluster JOINs) across one or more
  per-Elasticsearch-version sidecars. This chart deploys the ES-agnostic
  federation server; sidecars are added in a later chart revision.
type: application
# Chart version — bump on every chart change (SemVer).
# 0.2.0: per-ES-version sidecars + federation servers ConfigMap (Story 16.2).
# 0.3.0: Kubernetes Secrets (key-name contract + per-key override + envFrom),
#        Secret-backed federation→sidecar creds (CONFIG_FORCE_*), TLS/Ingress (Story 16.3).
# 0.3.1: appVersion 0.2.1 — arrow-extensions JoinExtension priority fix
#        (softclient4es-arrow#125) rolled into the federation + sidecar images.
# 0.3.2: appVersion 0.2.2 — elasticsql 0.20.1 (#157 loud cross-index JOIN
#        failure without a join-capable extension, #158 ORDER BY table-alias
#        qualifier preserved on the AST→SQL round-trip, #159 bare-alias sort
#        rejected) + extensions 0.2.1, rolled into the federation + sidecar
#        images (softclient4es-arrow#126).
# 0.3.3: appVersion 0.2.3 — elasticsql 0.20.2 (REPL epic: layered CLI config
#        precedence, -all bundle packaging, AppCDS cold-start; fixes #168 es6
#        log4j-api, #171 resolver SPI service, #172 watcher substitutions)
#        + extensions 0.2.2 + async DuckDB native-library warm-up, rolled into
#        the federation + sidecar images (softclient4es-arrow#128).
# 0.3.4: appVersion 0.2.4 — elasticsql 0.20.3 (R1 defect closures: local-file
#        COPY INTO without Hadoop #183, ES client exception status preserved
#        #184, single-table materialized views #185, and a DDL statement that
#        can succeed WITH A WARNING) + extensions 0.2.3 (the refresh watcher is
#        optional: a JOIN materialized view is created with a warning on a
#        basic licence instead of rolling back) + arrow 0.2.4 (statement-kind
#        routing allowlist — a DDL statement carrying a JOIN reaches the
#        materialized-view extension, not the federation JOIN planner,
#        softclient4es-arrow#130), rolled into the federation + sidecar images.
# 0.3.5: appVersion 0.2.5 — elasticsql 0.20.4 (completeness family: GROUP BY
#        #205, window PARTITION BY #207, un-LIMITed SELECT #209 and explicit
#        LIMIT above index.max_result_window #224 no longer truncate silently;
#        PIT paging sorts by _doc and gates at 7.12 #197; strict
#        whole-statement parsing #213) + extensions 0.2.4 (materialized-view
#        error integrity: an outage is no longer reported as "does not exist"
#        #45, a failed metadata table is no longer a quota breach #46) +
#        arrow 0.2.5 (JOIN legs past 4,032 rows softclient4es-arrow#143, lazily
#        streamed bounded legs #147, a writable bounded DuckDB spill directory
#        #141, a real health probe #146, and the server images ship a default
#        logback.xml so they no longer boot at ROOT DEBUG #138), rolled into the
#        federation + sidecar images.
# 0.3.6: appVersion 0.3.0 — elasticsql 0.21.0 (sliced PIT row extraction #238:
#        one reader per primary shard, merged into a single stream, with a new
#        `elastic.scroll { size, max-slices }` HOCON surface and ELASTIC_SCROLL_*
#        env overrides; row order of an un-ordered extraction now INTERLEAVES
#        across slices, and a quota-capped result is an arbitrary subset)
#        + extensions 0.3.0 + arrow 0.3.0 (the advertised-schema probe is
#        bounded, so a LIMITed SELECT no longer hits Elasticsearch a second time
#        softclient4es-arrow#163), rolled into the federation + sidecar images.
#        BREAKING (chart): the licence trust root is now embedded in the image, so
#        SOFTCLIENT4ES_LICENSE_PUBLIC_KEY is no longer consulted. `license.
#        publicKeySecretName` / `publicKeyKey` are retained ONLY to abort the render
#        with an actionable message — a value that used to decide HOW a licence is
#        verified must not decay into a silent no-op. Remove them from your values.
#        A licence issued by the SoftClient4ES licence server verifies with no extra
#        configuration, air-gapped clusters included; a self-signed JWT can no longer
#        be made to verify by supplying its public key.
version: 0.3.6
# The federation application/image version this chart deploys by default.
# Keep in sync with docker.io/softnetwork/softclient4es-federation:<tag>.
# Verified published on DockerHub for the federation image AND all four
# softclient4es{6,7,8,9}-arrow-flight-sql sidecar images.
appVersion: "0.3.0"
keywords:
  - elasticsearch
  - flight-sql
  - federation
  - arrow
  - sql
  - duckdb
home: https://softclient4es.dev
sources:
  - https://github.com/SOFTNETWORK-APP/softclient4es-helm
maintainers:
  - name: SOFTNETWORK
    url: https://softclient4es.dev
icon: https://softclient4es.dev/images/logo.png
