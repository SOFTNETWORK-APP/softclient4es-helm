# EXAMPLE ONLY — NON-FUNCTIONAL PLACEHOLDER.
# The encryptedData below was sealed with an EXAMPLE public key and WILL NOT decrypt
# in your cluster. You MUST re-seal with YOUR sealed-secrets controller's cert:
#
#   kubectl create secret generic es-prod-us \
#     --from-literal=es-auth-method=basic \
#     --from-literal=es-username=elastic \
#     --from-literal=es-password='<your-password>' \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-name sealed-secrets --controller-namespace kube-system \
#       --format yaml > es-credentials.sealedsecret.yaml
#
# GOTCHA 1 (CLI vs chart version): the kubeseal CLI version must match the controller
# appVersion (the Helm CHART version is a DIFFERENT number — chart 2.16.2 bundles
# controller/CLI 0.27.2; the repo MOVED bitnami-labs.github.io -> bitnami.github.io). A
# mismatched CLI can produce a SealedSecret the controller can't unseal. Pin the CLI to the
# controller's appVersion.
# GOTCHA 2 — SCOPE/NAMESPACE: by DEFAULT a SealedSecret is *strict*-scoped — sealed for an
# EXACT name + namespace. This placeholder is sealed for name=es-prod-us, namespace=default.
# If you deploy the chart into a DIFFERENT namespace (e.g. --namespace federation), you MUST
# re-seal with --namespace <that-ns> on the `kubectl create secret` (the namespace is part of
# the encryption AAD), OR seal namespace-/cluster-wide: add `--scope namespace-wide` (any name,
# fixed ns) or `--scope cluster-wide` (any name, any ns) to kubeseal AND the matching
# `sealedsecrets.bitnami.com/namespace-wide`/`cluster-wide` annotation on the source Secret.
# A name/namespace mismatch fails to decrypt SILENTLY (the Secret is never materialized ->
# the chart's optional:true secretKeyRefs no-op -> CrashLoop). Re-seal (strict, default ns):
#   kubectl create secret generic es-prod-us --namespace <your-ns> \
#     --from-literal=es-auth-method=basic --from-literal=es-username=elastic \
#     --from-literal=es-password='<pwd>' --dry-run=client -o yaml \
#   | kubeseal --controller-name sealed-secrets --controller-namespace kube-system --format yaml \
#   > es-credentials.sealedsecret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: es-prod-us
  namespace: default
spec:
  encryptedData:
    es-auth-method: AgBPLACEHOLDERNOTREALRESEALREQUIRED==
    es-username: AgCPLACEHOLDERNOTREALRESEALREQUIRED==
    es-password: AgDPLACEHOLDERNOTREALRESEALREQUIRED==
  template:
    metadata:
      name: es-prod-us
      namespace: default
    type: Opaque
