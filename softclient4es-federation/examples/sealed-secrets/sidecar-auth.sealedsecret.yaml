# EXAMPLE ONLY — NON-FUNCTIONAL PLACEHOLDER (re-seal as in es-credentials.sealedsecret.yaml).
# Feeds BOTH the sidecar's ARROW_AUTH_* AND the federation's CONFIG_FORCE_* (one Secret —
# Story 16.3, FACT A). Re-seal with YOUR controller's cert:
#   kubectl create secret generic prod-us-arrow-auth \
#     --from-literal=arrow-bearer-token='<token>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > sidecar-auth.sealedsecret.yaml
# Same namespace/scope gotcha as es-credentials.sealedsecret.yaml applies.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: prod-us-arrow-auth
  namespace: default
spec:
  encryptedData:
    arrow-bearer-token: AgXPLACEHOLDERNOTREALRESEALREQUIRED==
  template:
    metadata:
      name: prod-us-arrow-auth
      namespace: default
    type: Opaque
