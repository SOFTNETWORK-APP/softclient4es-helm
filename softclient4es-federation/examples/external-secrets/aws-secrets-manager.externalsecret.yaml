# External Secrets Operator (ESO) — AWS Secrets Manager backend.
# Materializes the chart-expected Secret `es-prod-us` from an AWS Secrets Manager secret.
# Prereq: ESO installed; IRSA/role with secretsmanager:GetSecretValue. The chart does NOT
# create the K8s Secret — ESO does, from your cloud secret store.
#
# API VERSION: uses `external-secrets.io/v1` — the STABLE API. ESO DEPRECATED and then REMOVED
# `v1beta1` at v0.17.0 (the webhook auto-converts v1beta1->v1 from v0.16.x). If you run ESO < 0.16
# substitute `v1beta1`; on ESO >= 0.17 only `v1` is served. Validate the example against YOUR
# installed ESO CRDs (kubeconform with -schema-location pointed at the ESO CRD schemas — ESO CRDs
# are not in the default kubeconform schema set, so these examples are schema-checked only when
# the ESO schema location is provided, else skipped, not failed).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-prod-us
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: es-prod-us          # MUST match sidecars[].elasticsearch.credentialsSecretName
    creationPolicy: Owner
  data:
    - secretKey: es-auth-method     # chart-expected key (FACT C contract)
      remoteRef:
        key: prod/es-prod-us
        property: auth_method
    - secretKey: es-username
      remoteRef:
        key: prod/es-prod-us
        property: username
    - secretKey: es-password
      remoteRef:
        key: prod/es-prod-us
        property: password
