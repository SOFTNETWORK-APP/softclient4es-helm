# External Secrets Operator (ESO) — HashiCorp Vault (KV v2) backend.
# NB: this is the ESO->Vault path (a SecretStore with a vault provider). The Vault Agent
# Injector ALTERNATIVE (sidecar-injection via pod annotations) is a DIFFERENT integration
# documented in docs/secret-backends.md — it injects a file, not a K8s Secret, so it pairs
# with `useEnvFrom: false` + a custom command, and is the "best-effort" tier.
# See aws-secrets-manager.externalsecret.yaml for the `external-secrets.io/v1` API-version note.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: default
spec:
  provider:
    vault:
      server: "https://vault.example.com:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "softclient4es"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-prod-us
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: es-prod-us          # MUST match sidecars[].elasticsearch.credentialsSecretName
    creationPolicy: Owner
  data:
    - secretKey: es-username
      remoteRef:
        key: prod/es-prod-us
        property: username
    - secretKey: es-password
      remoteRef:
        key: prod/es-prod-us
        property: password
