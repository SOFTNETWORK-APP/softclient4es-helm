# External Secrets Operator (ESO) — GCP Secret Manager backend.
# Materializes the chart-expected Secret `prod-us-arrow-auth` (feeds BOTH the sidecar's
# ARROW_AUTH_* AND the federation's CONFIG_FORCE_* — Story 16.3, FACT A) from GCP Secret
# Manager. Prereq: ESO installed; Workload Identity bound to a GCP SA with
# secretmanager.versions.access. See aws-secrets-manager.externalsecret.yaml for the
# `external-secrets.io/v1` API-version note.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secretmanager
  namespace: default
spec:
  provider:
    gcpsm:
      projectID: my-gcp-project
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: my-cluster
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prod-us-arrow-auth
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secretmanager
    kind: SecretStore
  target:
    name: prod-us-arrow-auth   # MUST match sidecars[].auth.credentialsSecretName
    creationPolicy: Owner
  data:
    - secretKey: arrow-bearer-token         # chart-expected key (FACT C contract)
      remoteRef:
        key: prod-us-arrow-token
